version: 1
# Connect this repo to Amplify (app root = frontend/) OR set Amplify "App root" to frontend.
# Manual zip deploys via scripts/deploy/deploy-frontend.ps1 do not need this file.
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Override in Amplify Console → Environment variables
        - echo "NEXT_PUBLIC_BACKEND_API_URL=$NEXT_PUBLIC_BACKEND_API_URL"
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
